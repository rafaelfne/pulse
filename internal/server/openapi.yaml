openapi: 3.0.3
info:
  title: Pulse API
  version: 0.2.0
  description: |
    High-performance event ingestion and distributed stream processing API.
    
    Pulse provides a simple HTTP API for ingesting events and streaming them back with partition-based offsets.
    
    **Phase 1 Features:**
    - Batch event ingestion
    - Offset-based streaming
    - Metrics and health monitoring
    
    **Phase 2 Features:**
    - Consumer groups with static partition assignment
    - Persistent offset tracking per group
    - ACK-based commit protocol (at-least-once delivery)
    - Inflight message backpressure
    - Consumer heartbeats and failure detection
  contact:
    name: Pulse Team
  license:
    name: TBD

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Ingest
    description: Event ingestion endpoints
  - name: Stream
    description: Event streaming endpoints
  - name: Consumer Groups
    description: Consumer group management (Phase 2)
  - name: Observability
    description: Metrics and health monitoring

paths:
  /events:
    post:
      summary: Ingest a batch of events
      description: |
        Accepts a batch of events and writes them to the partitioned log.
        Each event is assigned to a partition based on its key (via consistent hashing).
        Returns the partition and offset for each ingested event.
      operationId: ingestEvents
      tags:
        - Ingest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
            examples:
              simple:
                summary: Simple batch with two events
                value:
                  events:
                    - key: "user-1"
                      data: "eyJ0ZXN0IjoxfQ=="
                    - key: "user-2"
                      data: "eyJ0ZXN0IjoyfQ=="
              noKey:
                summary: Event without a key (random partition)
                value:
                  events:
                    - key: ""
                      data: "eyJtZXNzYWdlIjoiaGVsbG8ifQ=="
      responses:
        '200':
          description: Events ingested successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
              examples:
                success:
                  summary: Successful ingestion
                  value:
                    results:
                      - partition: 0
                        offset: 42
                      - partition: 2
                        offset: 13
        '400':
          description: Bad request (invalid JSON or batch size exceeded)
          content:
            text/plain:
              schema:
                type: string
              examples:
                invalidJSON:
                  value: "Invalid JSON"
                batchTooLarge:
                  value: "batch size 1500 exceeds max 1000"
        '405':
          description: Method not allowed (only POST is supported)
          content:
            text/plain:
              schema:
                type: string
              example: "Method not allowed"
        '413':
          description: Request body too large
          content:
            text/plain:
              schema:
                type: string
              example: "Request body too large"
        '500':
          description: Internal server error during ingestion
          content:
            text/plain:
              schema:
                type: string
              example: "Internal server error"

  /stream:
    get:
      summary: Stream events from a partition
      description: |
        Reads events from a specific partition starting at the given offset.
        Returns up to `limit` events (default: 100, max: configured by server).
        
        Use this endpoint to consume events sequentially from a partition.
        Track the highest offset returned to resume from that point.
      operationId: streamEvents
      tags:
        - Stream
      parameters:
        - name: partition
          in: query
          required: true
          description: Partition ID to read from (0-indexed)
          schema:
            type: integer
            minimum: 0
          example: 0
        - name: offset
          in: query
          required: false
          description: Starting offset (inclusive). Defaults to 0.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
          example: 42
        - name: limit
          in: query
          required: false
          description: Maximum number of events to return. Default is 100.
          schema:
            type: integer
            minimum: 1
            default: 100
          example: 100
      responses:
        '200':
          description: Events retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamResult'
              examples:
                withEvents:
                  summary: Stream with events
                  value:
                    entries:
                      - offset: 42
                        timestamp: 1704067200000000000
                        key: "user-1"
                        data: "eyJ0ZXN0IjoxfQ=="
                      - offset: 43
                        timestamp: 1704067201000000000
                        key: "user-1"
                        data: "eyJ0ZXN0IjoyfQ=="
                empty:
                  summary: No events at offset
                  value:
                    entries: []
        '400':
          description: Bad request (missing or invalid parameters)
          content:
            text/plain:
              schema:
                type: string
              examples:
                missingPartition:
                  value: "Missing partition parameter"
                invalidPartition:
                  value: "Invalid partition"
                invalidOffset:
                  value: "Invalid offset"
                invalidLimit:
                  value: "Invalid limit"
        '405':
          description: Method not allowed (only GET is supported)
          content:
            text/plain:
              schema:
                type: string
              example: "Method not allowed"
        '500':
          description: Internal server error during streaming
          content:
            text/plain:
              schema:
                type: string
              example: "Internal server error"

  /metrics:
    get:
      summary: Get server metrics
      description: |
        Returns runtime metrics for monitoring and observability.
        Includes counters for ingest/stream operations and latency statistics.
      operationId: getMetrics
      tags:
        - Observability
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
              example:
                ingest_requests: 1543
                ingest_events: 15234
                ingest_errors: 2
                ingest_avg_latency_ms: 3.42
                stream_requests: 891
                stream_events: 45123
                stream_errors: 0
        '405':
          description: Method not allowed (only GET is supported)
          content:
            text/plain:
              schema:
                type: string
              example: "Method not allowed"

  /health:
    get:
      summary: Health check endpoint
      description: |
        Simple health check that returns "OK" if the server is running.
        Use this for readiness/liveness probes.
      operationId: healthCheck
      tags:
        - Observability
      responses:
        '200':
          description: Server is healthy
          content:
            text/plain:
              schema:
                type: string
                enum: ["OK"]
              example: "OK"

  /groups/{groupId}/stream:
    get:
      summary: Stream events from a partition as a consumer group member
      description: |
        Reads events from a specific partition starting at the committed offset for the consumer group.
        The consumer is automatically registered in the group if not already present.
        
        **Consumer Group Semantics:**
        - Each partition is assigned to at most one consumer per group
        - The server tracks committed offsets per (group, partition)
        - Events are delivered starting from the last committed offset
        - Inflight message limits are enforced for backpressure
        
        Use this endpoint with the ACK endpoint for at-least-once delivery.
      operationId: groupStream
      tags:
        - Consumer Groups
      parameters:
        - name: groupId
          in: path
          required: true
          description: Consumer group identifier
          schema:
            type: string
            minLength: 1
          example: "my-consumer-group"
        - name: consumerId
          in: query
          required: true
          description: Unique identifier for this consumer within the group
          schema:
            type: string
            minLength: 1
          example: "consumer-1"
        - name: partition
          in: query
          required: true
          description: Partition ID to read from (must be assigned to this consumer)
          schema:
            type: integer
            minimum: 0
          example: 0
        - name: limit
          in: query
          required: false
          description: Maximum number of events to return. Default is 100.
          schema:
            type: integer
            minimum: 1
            default: 100
          example: 100
      responses:
        '200':
          description: Events retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamResult'
              examples:
                withEvents:
                  summary: Stream with events
                  value:
                    entries:
                      - offset: 42
                        timestamp: 1704067200000000000
                        key: "user-1"
                        data: "eyJ0ZXN0IjoxfQ=="
                empty:
                  summary: No events at offset
                  value:
                    entries: []
        '400':
          description: Bad request (missing or invalid parameters)
          content:
            text/plain:
              schema:
                type: string
              examples:
                missingConsumerId:
                  value: "Missing consumerId parameter"
                missingPartition:
                  value: "Missing partition parameter"
                invalidPartition:
                  value: "Invalid partition"
                invalidLimit:
                  value: "Invalid limit"
        '403':
          description: Partition not assigned to this consumer
          content:
            text/plain:
              schema:
                type: string
              example: "Partition not assigned to consumer: partition 0 assigned to consumer-2, not consumer-1"
        '405':
          description: Method not allowed (only GET is supported)
          content:
            text/plain:
              schema:
                type: string
              example: "Method not allowed"
        '429':
          description: Max inflight messages reached (backpressure)
          content:
            text/plain:
              schema:
                type: string
              example: "Max inflight messages reached"
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
              example: "Internal server error"

  /groups/{groupId}/ack:
    post:
      summary: Acknowledge (commit) processed events
      description: |
        Commits the offset for a consumer group and partition after processing events.
        This advances the committed offset so subsequent reads start from the new position.
        
        **At-Least-Once Delivery:**
        - Only call ACK after successfully processing the events
        - If ACK fails, the events will be redelivered on the next stream call
        - Offsets must be monotonically increasing (cannot commit a lower offset)
        
        The consumer must own the partition to commit offsets.
      operationId: groupAck
      tags:
        - Consumer Groups
      parameters:
        - name: groupId
          in: path
          required: true
          description: Consumer group identifier
          schema:
            type: string
            minLength: 1
          example: "my-consumer-group"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckRequest'
            examples:
              simple:
                summary: Acknowledge offset 42 on partition 0
                value:
                  consumerId: "consumer-1"
                  partition: 0
                  offset: 42
      responses:
        '200':
          description: Offset committed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                status: "ok"
        '400':
          description: Bad request (invalid JSON or missing fields)
          content:
            text/plain:
              schema:
                type: string
              examples:
                invalidJSON:
                  value: "Invalid JSON"
                missingConsumerId:
                  value: "Missing consumerId"
        '403':
          description: Partition not assigned to this consumer
          content:
            text/plain:
              schema:
                type: string
              example: "Partition not assigned to consumer: partition 0 assigned to consumer-2, not consumer-1"
        '405':
          description: Method not allowed (only POST is supported)
          content:
            text/plain:
              schema:
                type: string
              example: "Method not allowed"
        '500':
          description: Failed to commit offset
          content:
            text/plain:
              schema:
                type: string
              example: "Failed to commit offset"

  /groups/{groupId}/heartbeat:
    post:
      summary: Send consumer heartbeat
      description: |
        Sends a heartbeat to keep the consumer alive in the group.
        Consumers that don't send heartbeats within the timeout period are considered dead
        and their partition assignments are released for reassignment.
        
        **Liveness Detection:**
        - Heartbeat timeout is configurable via PULSE_CONSUMER_TIMEOUT_MS (default: 30 seconds)
        - Dead consumers are automatically removed from the group
        - Partitions are reassigned using round-robin among remaining consumers
        - Committed offsets are preserved (no rewind on consumer failure)
        
        If the consumer is not registered, this endpoint will register it.
      operationId: groupHeartbeat
      tags:
        - Consumer Groups
      parameters:
        - name: groupId
          in: path
          required: true
          description: Consumer group identifier
          schema:
            type: string
            minLength: 1
          example: "my-consumer-group"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
            examples:
              simple:
                summary: Send heartbeat for consumer-1
                value:
                  consumerId: "consumer-1"
      responses:
        '200':
          description: Heartbeat received successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                status: "ok"
        '400':
          description: Bad request (invalid JSON or missing fields)
          content:
            text/plain:
              schema:
                type: string
              examples:
                invalidJSON:
                  value: "Invalid JSON"
                missingConsumerId:
                  value: "Missing consumerId"
        '405':
          description: Method not allowed (only POST is supported)
          content:
            text/plain:
              schema:
                type: string
              example: "Method not allowed"
        '500':
          description: Failed to send heartbeat
          content:
            text/plain:
              schema:
                type: string
              example: "Failed to send heartbeat"

components:
  schemas:
    Event:
      type: object
      description: A single event to ingest
      required:
        - key
        - data
      properties:
        key:
          type: string
          description: |
            Partition key for the event. Used for consistent hashing to assign the event to a partition.
            Can be empty string (will use random partition).
          example: "user-123"
        data:
          type: string
          format: byte
          description: |
            Base64-encoded event payload. The server does not interpret this data.
            Maximum size depends on server configuration (PULSE_MAX_BODY_BYTES).
          example: "eyJ0ZXN0IjoxfQ=="
        timestamp:
          type: integer
          format: int64
          description: |
            Optional client timestamp in nanoseconds. 
            Note: This field is present in the request schema but is not used by the server.
            Server always assigns timestamps upon ingestion. This field exists for client convenience 
            and future compatibility but currently has no effect on storage or ordering.
          example: 1704067200000000000

    EventBatch:
      type: object
      description: |
        A batch of events to ingest. Empty batches (0 events) are accepted and return an empty result.
      required:
        - events
      properties:
        events:
          type: array
          description: Array of events to ingest (max size configurable via PULSE_MAX_BATCH_SIZE, default 1000)
          items:
            $ref: '#/components/schemas/Event'
          minItems: 0
          maxItems: 1000

    IngestResult:
      type: object
      description: Result of ingesting a batch of events
      required:
        - results
      properties:
        results:
          type: array
          description: Per-event result containing partition and offset
          items:
            $ref: '#/components/schemas/EventResult'

    EventResult:
      type: object
      description: Result for a single ingested event
      required:
        - partition
        - offset
      properties:
        partition:
          type: integer
          description: Partition ID where the event was written
          minimum: 0
          example: 0
        offset:
          type: integer
          format: int64
          description: Offset within the partition where the event was written
          minimum: 0
          example: 42

    StreamResult:
      type: object
      description: Result of a stream request
      required:
        - entries
      properties:
        entries:
          type: array
          description: Array of log entries read from the partition
          items:
            $ref: '#/components/schemas/LogEntry'

    LogEntry:
      type: object
      description: A log entry read from storage
      required:
        - offset
        - timestamp
        - key
        - data
      properties:
        offset:
          type: integer
          format: int64
          description: Offset of this entry within its partition
          minimum: 0
          example: 42
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp in nanoseconds when the event was ingested
          example: 1704067200000000000
        key:
          type: string
          description: Partition key of the original event
          example: "user-123"
        data:
          type: string
          format: byte
          description: Base64-encoded event payload
          example: "eyJ0ZXN0IjoxfQ=="

    Metrics:
      type: object
      description: Server runtime metrics
      required:
        - ingest_requests
        - ingest_events
        - ingest_errors
        - ingest_avg_latency_ms
        - stream_requests
        - stream_events
        - stream_errors
        - group_stream_requests
        - group_stream_events
        - group_stream_errors
        - ack_requests
        - ack_errors
        - heartbeat_requests
        - heartbeat_errors
      properties:
        ingest_requests:
          type: integer
          format: int64
          description: Total number of ingest requests received
          example: 1543
        ingest_events:
          type: integer
          format: int64
          description: Total number of events ingested
          example: 15234
        ingest_errors:
          type: integer
          format: int64
          description: Total number of ingest errors
          example: 2
        ingest_avg_latency_ms:
          type: number
          format: double
          description: Average ingest latency in milliseconds
          example: 3.42
        stream_requests:
          type: integer
          format: int64
          description: Total number of stream requests received
          example: 891
        stream_events:
          type: integer
          format: int64
          description: Total number of events streamed
          example: 45123
        stream_errors:
          type: integer
          format: int64
          description: Total number of stream errors
          example: 0
        group_stream_requests:
          type: integer
          format: int64
          description: Total number of consumer group stream requests received
          example: 456
        group_stream_events:
          type: integer
          format: int64
          description: Total number of events streamed via consumer groups
          example: 12345
        group_stream_errors:
          type: integer
          format: int64
          description: Total number of consumer group stream errors
          example: 1
        ack_requests:
          type: integer
          format: int64
          description: Total number of ACK (commit) requests received
          example: 234
        ack_errors:
          type: integer
          format: int64
          description: Total number of ACK errors
          example: 0
        ack_avg_latency_ms:
          type: number
          format: double
          description: Average ACK latency in milliseconds (only present if ack_requests > 0)
          example: 1.23
        heartbeat_requests:
          type: integer
          format: int64
          description: Total number of heartbeat requests received
          example: 567
        heartbeat_errors:
          type: integer
          format: int64
          description: Total number of heartbeat errors
          example: 0

    AckRequest:
      type: object
      description: Request to acknowledge (commit) processed events
      required:
        - consumerId
        - partition
        - offset
      properties:
        consumerId:
          type: string
          description: Unique identifier for the consumer within the group
          minLength: 1
          example: "consumer-1"
        partition:
          type: integer
          description: Partition ID to commit offset for
          minimum: 0
          example: 0
        offset:
          type: integer
          format: int64
          description: Offset to commit (must be >= current committed offset)
          minimum: 0
          example: 42

    HeartbeatRequest:
      type: object
      description: Request to send consumer heartbeat
      required:
        - consumerId
      properties:
        consumerId:
          type: string
          description: Unique identifier for the consumer within the group
          minLength: 1
          example: "consumer-1"

    StatusResponse:
      type: object
      description: Generic status response
      required:
        - status
      properties:
        status:
          type: string
          description: Status message
          enum: ["ok"]
          example: "ok"
